name: FModel Builder

on:
  workflow_dispatch:
    inputs:
        appVersion:
          description: 'FModel Version And Release Tag'
          required: true
          default: '4.0.X.X'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: FModel/FModel.csproj
            framework: net8.0-windows
            suffix: win-x64
            binary: FModel.exe
          - os: macos-latest
            rid: osx-x64
            project: FModel.Mac/FModel.Mac.csproj
            framework: net8.0
            suffix: macos-x64
            binary: FModel.Mac
          - os: macos-latest
            rid: osx-arm64
            project: FModel.Mac/FModel.Mac.csproj
            framework: net8.0
            suffix: macos-arm64
            binary: FModel.Mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      - name: .NET 8 Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Patch ACL for MacOS
        if: runner.os == 'macOS'
        run: sed -i 's/template is_bound_to(/template is_bound_to<>(/g' CUE4Parse/CUE4Parse-Natives/ACL/external/acl/includes/acl/decompression/impl/decompress.impl.h

      - name: Download Native Dependencies (MacOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p FModel.Mac/Native/Mac
          curl -L https://github.com/WorkingRobot/OodleUE/raw/refs/heads/main/Engine/Source/Runtime/OodleDataCompression/Sdks/2.9.16/lib/Mac/liboo2coremac64.2.9.16.dylib -o FModel.Mac/Native/Mac/liboo2coremac64.dylib
          curl -L https://github.com/WorkingRobot/OodleUE/raw/refs/heads/main/Engine/Source/Runtime/OodleDataCompression/Sdks/2.9.16/lib/Mac/liboo2extmac64.2.9.16.dylib -o FModel.Mac/Native/Mac/liboo2extmac64.dylib

      - name: .NET Restore
        run: dotnet restore "${{ matrix.project }}" -r ${{ matrix.rid }}

      - name: .NET Publish
        run: dotnet publish "${{ matrix.project }}" -c Release --no-self-contained -r ${{ matrix.rid }} -f ${{ matrix.framework }} -o "./Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false -p:AssemblyVersion=${{ github.event.inputs.appVersion }} -p:FileVersion=${{ github.event.inputs.appVersion }}

      - name: ZIP File (Windows)
        if: matrix.os == 'windows-latest'
        uses: papeloto/action-zip@v1.2
        with:
          files: ./Publish/
          dest: FModel-${{ matrix.suffix }}.zip

      - name: ZIP File (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          zip -r FModel-${{ matrix.suffix }}.zip Publish/

      - name: GIT Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          title: "FModel v${{ github.event.inputs.appVersion }}"
          automatic_release_tag: ${{ github.event.inputs.appVersion }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: FModel-${{ matrix.suffix }}.zip
